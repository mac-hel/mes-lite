name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meslite
          POSTGRES_PASSWORD: meslite
          POSTGRES_DB: meslite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U meslite
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Tidy
        run: go mod tidy && go mod verify

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test ./... -v -count=1 -race -shuffle=on

      - name: Build production Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t mes-lite:ci .

      - name: Smoke-test production Docker image
        env:
          IMAGE: mes-lite:ci
          DATABASE_URL: postgres://meslite:meslite@host.docker.internal:5432/meslite?sslmode=disable
          JWT_SECRET: ci-smoke-test-jwt-secret-with-at-least-32-characters
          EXPECTED_COMMIT: ${{ github.sha }}
        run: sh ./bin/smoke-production-image.sh
