services:
  postgres:
    image: postgres:17-alpine
    container_name: mes-lite-db
    environment:
      POSTGRES_USER: meslite
      POSTGRES_PASSWORD: meslite
      POSTGRES_DB: meslite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meslite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
