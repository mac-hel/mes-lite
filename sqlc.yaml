version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/production/queries"
    gen:
      go:
        package: "productiondb"
        out: "internal/production/productiondb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/employees/queries"
    gen:
      go:
        package: "employeesdb"
        out: "internal/employees/employeesdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/products/queries"
    gen:
      go:
        package: "productsdb"
        out: "internal/products/productsdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
